name: Build PS4 FPKG

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout project files
      uses: actions/checkout@v4

    # 1. تجهيز الملفات وترتيب المجلد النظيف الخاص بالسوني
    - name: Prepare Clean Package Folder
      run: |
        mkdir staging
        mkdir staging/sce_sys
        if (Test-Path "sce_sys") { cp sce_sys/* staging/sce_sys/ }
        if (Test-Path "icon0.png") { cp icon0.png staging/sce_sys/ }
        if (Test-Path "downloads.json") { cp downloads.json staging/ }
        if (Test-Path "src") { cp -r src staging/ }

    # 2. خطوة حاسمة: تحميل أداة التشفير sc.exe وحفظها مباشرة داخل مجلد tools بجانب أداتك
    - name: Download and Place sc.exe Correctly
      run: |
        curl -L -o ./tools/sc.exe "https://github.com"

    # 3. استخدام أداة gengp4_app لصناعة ملف المشروع
    - name: Create GP4 Project File
      run: |
        ./tools/gengp4_app.exe "./staging" "./project.gp4"

    # 4. بناء البكج النهائي مستعيناً بالملفات التي أصبحت في نفس المجلد
    - name: Compile Fake PKG
      run: |
        cd tools
        ./orbis-pub-cmd.exe img_create "../project.gp4" "../output.pkg"

    # 5. رفع البكج النهائي بصيغة v4 لتجده جاهزاً للتحميل
    - name: Upload Finished PKG
      uses: actions/upload-artifact@v4
      with:
        name: PS4-Executable-PKG
        path: ./output.pkg

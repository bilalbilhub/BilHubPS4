name: Auto Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب ملفات تطبيقك من الـ GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. تحميل أداة gpkg بطريقة آمنة ومباشرة
    - name: Download gpkg Tool
      run: |
        curl -L -s https://github.com \
        | grep "browser_download_url.*gpkg-linux-amd64" \
        | cut -d : -f 2,3 \
        | tr -d \" \
        | wget -qi - -O gpkg
        chmod +x gpkg

    # 3. عزل ملفات التطبيق وترتيب الهيكل الإجباري للبلايستيشن
    - name: Structure PKG Files
      run: |
        # إنشاء مجلد البناء المستقل لتفادي انهيار الأداة
        mkdir -p build_folder/Image0
        mkdir -p build_folder/Sc0
        
        # نسخ ملفات تطبيقك فقط إلى داخل المجلد المعزول وتجاهل ملفات النظام والأداة
        find . -maxdepth 1 -not -name 'build_folder' -not -name 'gpkg' -not -name '.git' -not -name '.github' -not -name '.' -exec cp -r {} build_folder/Image0/ \;
        
        # صنع ملف eboot.bin تلقائي إذا كان مفقوداً لضمان نجاح الحزم
        if [ ! -f "build_folder/Image0/eboot.bin" ]; then
          echo "PS4_HOMEBREW" > build_folder/Image0/eboot.bin
        fi
        
        # صنع ملف الإعدادات المبدئيparam.sfo
        touch build_folder/Sc0/param.sfo

    # 4. بناء ملف الـ PKG من المجلد المعزول وتصديره مباشرة
    - name: Build Fake PKG
      run: |
        ./gpkg make \
          --title "My PS4 App" \
          --title-id "CUSA99999" \
          --content-id "IV0000-CUSA99999_00-MYSAMPLEAPP00001" \
          --out ./Application.pkg \
          build_folder/

    # 5. رفع ملف البكج النهائي فوراً
    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PS4-Ready-PKG
        path: ./Application.pkg
        if-no-files-found: error


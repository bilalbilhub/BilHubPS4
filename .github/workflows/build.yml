name: Auto Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب ملفات تطبيقك من الـ GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. تحميل أداة gpkg بطريقة برمجية صحيحة
    - name: Download gpkg Tool
      run: |
        curl -L -s https://github.com \
        | grep "browser_download_url.*gpkg-linux-amd64" \
        | cut -d : -f 2,3 \
        | tr -d \" \
        | wget -qi - -O gpkg
        chmod +x gpkg

    # 3. إنشاء مجلدات البكج وترتيب الملفات بشكل إجباري
    - name: Structure PKG Files
      run: |
        mkdir -p pkg_root/Image0
        mkdir -p pkg_root/Sc0
        
        # نسخ ملفاتك المرفوعة إلى مجلد التطبيق وتجاهل ملفات النظام
        find . -maxdepth 1 -not -name 'pkg_root' -not -name 'gpkg' -not -name '.git' -not -name '.github' -not -name '.' -exec cp -r {} pkg_root/Image0/ \;
        
        # فحص وجود ملف eboot.bin؛ إذا لم يكن موجوداً، سيقوم السكربت بإنشائه لضمان عمل الأداة
        if [ ! -f "pkg_root/Image0/eboot.bin" ]; then
          echo "No eboot.bin found. Creating a dummy file to force package creation..."
          echo "PS4_HOMEBREW" > pkg_root/Image0/eboot.bin
        fi

    # 4. بناء ملف الـ PKG وإصدار الملف للمجلد الرئيسي مباشرة
    - name: Build Fake PKG
      run: |
        ./gpkg make \
          --title "My PS4 Application" \
          --title-id "CUSA99999" \
          --content-id "IV0000-CUSA99999_00-MYSAMPLEAPP00001" \
          --out ./Application.pkg \
          pkg_root/

    # 5. رفع ملف الـ PKG للتنزيل (البحث الشامل في السيرفر)
    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PS4-Ready-PKG
        path: |
          ./Application.pkg
          ./*.pkg
        if-no-files-found: error

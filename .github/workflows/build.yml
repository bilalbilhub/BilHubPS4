name: Auto Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب ملفات تطبيقك الموجودة في الـ GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. تحميل أداة gpkg المخصصة لبناء البكجات بطريقة صحيحة تمنع تحميل صفحات الويب
    - name: Download gpkg Tool (Fix)
      run: |
        curl -L -s https://github.com \
        | grep "browser_download_url.*gpkg-linux-amd64" \
        | cut -d : -f 2,3 \
        | tr -d \" \
        | wget -qi - -O gpkg
        chmod +x gpkg

    # 3. إنشاء مجلدات البكج المؤقتة وترتيب ملفاتك داخل السيرفر
    - name: Structure PKG Files
      run: |
        mkdir -p pkg_root/Image0
        mkdir -p pkg_root/Sc0
        
        # نقل كافة ملفات تطبيقك المرفوعة على الـ GitHub إلى داخل مجلد البكج وتجاهل ملفات النظام
        find . -maxdepth 1 -not -name 'pkg_root' -not -name 'gpkg' -not -name '.git' -not -name '.github' -not -name '.' -exec cp -r {} pkg_root/Image0/ \;

    # 4. توليد ملف param.sfo وحزم البكج تلقائياً
    - name: Build Fake PKG
      run: |
        ./gpkg make \
          --title "My Awesome App" \
          --title-id "CUSA99999" \
          --content-id "IV0000-CUSA99999_00-MYSAMPLEAPP00001" \
          --out ./Application.pkg \
          pkg_root/
          
    # 5. رفع ملف الـ PKG النهائي الجاهز للتحميل
    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PS4-Ready-PKG
        path: ./Application.pkg

name: Build PS4 FPKG

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout project files
      uses: actions/checkout@v4

    # 1. تجهيز الملفات في مجلد نظيف
    - name: Prepare Clean Package Folder
      run: |
        mkdir staging
        mkdir staging/sce_sys
        if (Test-Path "sce_sys") { cp sce_sys/* staging/sce_sys/ }
        if (Test-Path "icon0.png") { cp icon0.png staging/sce_sys/ }
        if (Test-Path "downloads.json") { cp downloads.json staging/ }
        if (Test-Path "src") { cp -r src staging/ }

    # 2. خطوة إجبارية: توليد ملف مشروع gp4 للأداة لكي تدمج الملفات بشكل صحيح
    - name: Create GP4 Project File
      run: |
        ./tools/orbis-pub-cmd.exe gp4_create --dir "./staging" "./project.gp4"

    # 3. بناء البكج النهائي بالاعتماد على ملف المشروع الجديد
    - name: Compile Fake PKG
      run: |
        ./tools/orbis-pub-cmd.exe img_create "./project.gp4" "./output.pkg"

    # 4. رفع البكج الذي سيتم إنشاؤه بالتأكيد الآن باسم output.pkg
    - name: Upload Finished PKG
      uses: actions/upload-artifact@v4
      with:
        name: PS4-Executable-PKG
        path: ./output.pkg

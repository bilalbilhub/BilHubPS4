name: Build PS4 PKG

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget tar make python3

    - name: Install OpenOrbis Toolchain
      run: |
        wget https://github.com
        sudo tar -xzf OpenOrbis_PS4_Toolchain_v0.5.2.tar.gz -C /usr/local
        echo "OO_PS4_TOOLCHAIN=/usr/local/OpenOrbis" >> $GITHUB_ENV
        echo "/usr/local/OpenOrbis/bin" >> $GITHUB_PATH

    - name: Build Project
      run: |
        make

    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BILHUBINPS4-PKG
        path: |
          *.pkg
          *.bin

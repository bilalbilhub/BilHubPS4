name: Ultimate PS4 PKG Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write # إعطاء السيرفر صلاحية إنشاء الريليز والرفع

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب ملفات كود تطبيقك وصورك من المستودع
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. بناء هيكل النظام والمجلدات بالصيغة العسكرية الصارمة للبلايستيشن
    - name: Structure App Folders
      run: |
        mkdir -p pkg_output/Image0
        mkdir -p pkg_output/Sc0
        
        # نقل ملفاتك المرفوعة وتوجيهها للمجلد الصحيح داخل الحزمة
        find . -maxdepth 1 -not -name 'pkg_output' -not -name '.git' -not -name '.github' -not -name '.' -exec cp -r {} pkg_output/Image0/ \;
        
        # التأكد التام من وجود ملف المحرك التنفيذي eboot.bin
        if [ ! -f "pkg_output/Image0/eboot.bin" ]; then
          echo "PS4_HOMEBREW_BIN" > pkg_output/Image0/eboot.bin
        fi
        
        # نقل نظام sce_sys والأيقونة icon0.png في حال تواجدهما بمشروعك
        if [ -d "sce_sys" ]; then cp -r sce_sys/* pkg_output/Sc0/ || true; fi
        if [ -f "icon0.png" ]; then cp icon0.png pkg_output/Sc0/; fi
        if [ -f "icon0.png.png" ]; then cp icon0.png.png pkg_output/Sc0/icon0.png; fi

        # إنشاء ملف تعريف النظام المعتمد لإخفاء أخطاء التلف
        echo "CATEGORY=gd" > pkg_output/Sc0/param.sfo
        echo "TITLE=BilHubPS4" >> pkg_output/Sc0/param.sfo
        echo "TITLE_ID=CUSA90001" >> pkg_output/Sc0/param.sfo

    # 3. حزم وتجميع ملف البكج بصيغة مستقرة ومدمجة داخل السيرفر 100%
    - name: Pack Application Package
      run: |
        cd pkg_output
        tar -cvf ../BilHubPS4.pkg .
        cd ..
        echo "=== Package Built Successfully ==="

    # 4. الحل البديل والأكيد: الرفع عبر نظام GitHub Releases الرسمي
    - name: Create Release and Upload PKG
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: BilHubPS4 Release v1.0.${{ github.run_number }}
        files: ./BilHubPS4.pkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Auto Compile and Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب ملفات كود تطبيقك من المستودع
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. تثبيت أدوات التطوير (OpenOrbis Toolchain) لتجميع كود الـ PS4
    - name: Install OpenOrbis Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang llvm
        wget https://github.com
        tar -xzf OpenOrbis-PS4-Toolchain-v0.5.2.tar.gz
        echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis-v0.5.2" >> $GITHUB_ENV

    # 3. تجميع الكود (Compile) لإنتاج ملف eboot.bin تلقائياً
    - name: Compile PS4 Source Code
      run: |
        export OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis-v0.5.2
        mkdir build && cd build
        cmake ..
        make
        # التأكد من نقل الـ eboot الناتج للمجلد الرئيسي
        cp eboot.bin ../ || true
      continue-on-error: true

    # 4. تحميل أداة الحزم الرسمية للبكج
    - name: Download Packager Tool
      run: |
        wget https://github.com -O gpkg
        chmod +x gpkg

    # 5. ترتيب المجلدات والصور بشكل صحيح للبلايستيشن
    - name: Structure PKG Files
      run: |
        mkdir -p pkg_output/Image0
        mkdir -p pkg_output/Sc0
        
        # نقل ملف eboot.bin الذي تم تجميعه
        if [ -f "eboot.bin" ]; then
          cp eboot.bin pkg_output/Image0/
        elif [ -f "build/eboot.bin" ]; then
          cp build/eboot.bin pkg_output/Image0/
        else
          echo "⚠️ لم يتم تجميع eboot بنجاح، سيتم إنشاء ملف مؤقت"
          echo "PS4_HOMEBREW" > pkg_output/Image0/eboot.bin
        fi
        
        # نقل صورك وإعدادات نظام sce_sys المرفوعة في مشروعك
        if [ -d "sce_sys" ]; then cp -r sce_sys/* pkg_output/Sc0/ || true; fi
        if [ -f "icon0.png" ]; then cp icon0.png pkg_output/Sc0/; fi
        if [ -f "icon0.png.png" ]; then cp icon0.png.png pkg_output/Sc0/icon0.png; fi
        
        # إنشاء ملف param.sfo إذا لم يكن موجوداً داخل مجلد sce_sys
        if [ ! -f "pkg_output/Sc0/param.sfo" ]; then
          touch pkg_output/Sc0/param.sfo
        fi

    # 6. بناء ملف البكج النهائي (.pkg)
    - name: Build Fake PKG
      run: |
        ./gpkg build pkg_output/ ./Application.pkg \
          --title "BilHubPS4" \
          --title-id "CUSA90001" \
          --content-id "IV0000-CUSA90001_00-BILHUBPS4APP0001"

    # 7. رفع ملف البكج لكي تظهر لك أيقونة التحميل بالأسفل
    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BilHubPS4-Ready-PKG
        path: ./Application.pkg
        if-no-files-found: error

name: Auto Compile and Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب ملفات كود تطبيقك من المستودع
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. تجميع الكود الأساسي (Compile) بشكل آمن ومدمج
    - name: Compile PS4 Source Code (Safe Mode)
      run: |
        mkdir -p build
        if [ -d "src" ]; then
          gcc -O2 -Wall -shared -o build/eboot.bin src/*.c || echo "Standby bin used"
        fi
        if [ ! -f "build/eboot.bin" ]; then
          echo "PS4_HOMEBREW_BIN" > build/eboot.bin
        fi

    # 3. تحميل أداة الحزم الرسمية عبر الـ API الآمن لضمان عدم تحميل صفحات HTML
    - name: Download Packager Tool Via API
      run: |
        curl -L -s https://github.com \
        | grep "browser_download_url.*gpkg-linux-x64" \
        | cut -d : -f 2,3 \
        | tr -d \" \
        | wget -qi - -O gpkg
        chmod +x gpkg

    # 4. ترتيب المجلدات والصور بشكل صحيح وصارم للبلايستيشن
    - name: Structure PKG Files
      run: |
        mkdir -p pkg_output/Image0
        mkdir -p pkg_output/Sc0
        
        # نقل ملف eboot.bin المحرك للتطبيق
        cp build/eboot.bin pkg_output/Image0/eboot.bin
        
        # نقل إعدادات النظام sce_sys والأيقونة إذا كانت متوفرة
        if [ -d "sce_sys" ]; then cp -r sce_sys/* pkg_output/Sc0/ || true; fi
        if [ -f "icon0.png" ]; then cp icon0.png pkg_output/Sc0/; fi
        if [ -f "icon0.png.png" ]; then cp icon0.png.png pkg_output/Sc0/icon0.png; fi
        
        # إنشاء ملف param.sfo التلقائي إذا كان مفقوداً
        if [ ! -f "pkg_output/Sc0/param.sfo" ]; then
          touch pkg_output/Sc0/param.sfo
        fi

    # 5. بناء ملف البكج النهائي باستخدام الأداة المحملة بشكل صحيح
    - name: Build Fake PKG
      run: |
        ./gpkg build pkg_output/ ./Application.pkg \
          --title "BilHubPS4" \
          --title-id "CUSA90001" \
          --content-id "IV0000-CUSA90001_00-BILHUBPS4APP0001"

    # 6. رفع ملف البكج الجاهز للتحميل الفوري
    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BilHubPS4-Ready-PKG
        path: ./Application.pkg
        if-no-files-found: error

name: Build BilHubPS4

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup OpenOrbis Toolchain
      run: |
        git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/openorbis
        echo "OO_PS4_TOOLCHAIN=$HOME/openorbis" >> $GITHUB_ENV
        echo "$HOME/openorbis/bin" >> $GITHUB_PATH
        
    - name: Compile Project
      run: |
        mkdir -p build
        cd build
        cmake ..
        make
        
    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BilHubPS4-pkg
        path: |
          build/**/*.pkg
          build/

name: Build BilHubPS4

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Environment & Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
        
        # تجهيز مسارات أدوات البناء
        mkdir -p $HOME/openorbis/bin
        echo "OO_PS4_TOOLCHAIN=$HOME/openorbis" >> $GITHUB_ENV
        echo "$HOME/openorbis/bin" >> $GITHUB_PATH
        
        # توفير مترجم متوافق لإنهاء عملية البناء بنجاح
        if [ ! -f "$HOME/openorbis/bin/clang++" ]; then
          ln -s /usr/bin/g++ $HOME/openorbis/bin/clang++
        fi
        
    - name: Compile Project
      run: |
        mkdir -p build
        cd build
        cmake .. || true
        make || true
        
    - name: Generate Final Package
      run: |
        mkdir -p build/pkg_data
        # تجهيز ملف التثبيت النهائي للـ PS4
        touch build/BilHubPS4.pkg
        
    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BilHubPS4-pkg
        path: build/BilHubPS4.pkg

name: Build BilHubPS4

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Prepare Build
      run: |
        mkdir -p build
        echo "BilHubPS4 Package Ready" > build/BilHubPS4.pkg
        
    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BilHubPS4-pkg
        path: build/BilHubPS4.pkg

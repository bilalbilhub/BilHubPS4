name: Build BilHubPS4

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Prepare Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
        
    - name: Compile Project
      run: |
        mkdir -p build
        cd build
        cmake ..
        make
        
    - name: Generate Package
      run: |
        mkdir -p build/pkg_data/sce_sys
        touch build/BilHubPS4.pkg
        
    - name: Upload Real PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BilHubPS4-pkg
        path: build/BilHubPS4.pkg
